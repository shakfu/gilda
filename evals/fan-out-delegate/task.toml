prompt = "This repository has four independent services under services/: billing, auth, search and mail. For each, find the most times its client retries one request at runtime. Research each service in a background task of its own: call task with background true, one per service, and read their answers with task_collect before you answer. Answer on one line in exactly this form: billing=N auth=N search=N mail=N"
check = 'grep -q "billing=7 auth=4 search=9 mail=6" "$GILDA_ANSWER" && go run verify_records.go'
